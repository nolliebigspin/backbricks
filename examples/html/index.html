<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact (plain HTML)</title>
</head>
<body>
<h1>Contact (plain HTML)</h1>
<p>No JavaScript: the browser posts the form and shows <a href="thanks.html">the thank-you page</a>.</p>
<form method="post" action="http://localhost:5173/v1/public/forms/contact-plain/submissions?key=YOUR_PUBLISHABLE_KEY">
  <label>Name
    <input type="text" name="name" required>
  </label>
  <label>Email
    <input type="email" name="email" required>
  </label>
  <label>Message
    <textarea name="message" required></textarea>
  </label>
  <label><input type="checkbox" name="privacy" required> I agree that my details are stored to answer my message (privacy policy).</label>
  <div hidden>
    <input name="_gotcha" tabindex="-1" autocomplete="off">
  </div>
  <button type="submit">Send</button>
</form>
<p><a href="sdk.html">The same form with the SDK</a></p>
</body>
</html>
