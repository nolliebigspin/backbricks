name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  quality:
    name: Format, lint, architecture, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run lint:arch
      - run: bun run lint:workflows
      - run: bun run api:check
      - name: API compatibility against the actual base commit
        env:
          API_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bun run api:breaking --base "$API_BASE_REF"
      - run: bun run typecheck
      - run: bunx turbo run build

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-test-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # The dev environment is defined once in compose.yaml and reused here (same as `mise run infra`).
      - name: Start services
        run: mise run infra
      - run: bun run test
      - name: Service logs
        if: failure()
        run: docker compose --profile storage logs --no-color

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: bun install --frozen-lockfile
      - name: Start services
        run: mise run infra
      - run: bunx turbo run build --filter @backbricks/web --filter @backbricks/example-html
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: backbricks/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start services
        run: mise run infra
      - name: Smoke test (real worker consumption, non-root/read-only roles)
        run: bun scripts/image/smoke.ts backbricks/server:ci

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Signed-off-by on every commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha has no 'Signed-off-by' line. Use 'git commit -s' (see CONTRIBUTING.md)."
              missing=1
            fi
          done
          exit $missing
