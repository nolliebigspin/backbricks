name: backbricks-production

x-app: &app
  image: ${BACKBRICKS_IMAGE:?Set BACKBRICKS_IMAGE to an approved image or local build}
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]
  environment: &app-env
    NODE_ENV: production
    BACKBRICKS_MODULES: ${BACKBRICKS_MODULES:-forms}
    DATABASE_URL: postgres://backbricks:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/backbricks
    APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
    PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL}
    SIGNUP_POLICY: invite_only
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-${CADDY_ADDRESS:-172.31.241.2}}
    SMTP_URL: ${SMTP_URL:-}
    MAIL_FROM: ${MAIL_FROM:-}
    UPLOAD_MODE: ${UPLOAD_MODE:-proxy}
    S3_ENDPOINT: http://garage:3900
    S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
    S3_REGION: garage
    S3_BUCKET: backbricks
    S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
    S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    S3_FORCE_PATH_STYLE: 'true'
    SCANNER: ${SCANNER:-none}
    CLAMAV_HOST: clamav
  networks: [backend, edge]

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: backbricks
      POSTGRES_DB: backbricks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U backbricks -d backbricks']
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: [migrate]
    depends_on:
      postgres:
        condition: service_healthy

  setup:
    <<: *app
    profiles: [setup]
    command: [setup]
    stdin_open: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    <<: *app
    command: ['${BACKBRICKS_ROLE:-all}']
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
        required: false
      clamav:
        condition: service_healthy
        required: false
    ports:
      - '127.0.0.1:${BACKBRICKS_LOCAL_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          CMD,
          bun,
          -e,
          "await fetch('http://127.0.0.1:3000/readyz').then(r => process.exit(r.ok ? 0 : 1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    <<: *app
    profiles: [worker]
    command: [worker]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      garage-init:
        condition: service_completed_successfully
        required: false
      clamav:
        condition: service_healthy
        required: false

  caddy:
    image: caddy:2.11.9-alpine
    profiles: [tls]
    restart: unless-stopped
    environment:
      CADDY_HOST: ${CADDY_HOST:-localhost}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        ipv4_address: ${CADDY_ADDRESS:-172.31.241.2}
    depends_on:
      app:
        condition: service_healthy

  garage:
    image: dxflrs/garage:v2.5.0
    profiles: [storage]
    restart: unless-stopped
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    networks: [backend]
    healthcheck:
      test: [CMD, /garage, status]
      interval: 3s
      timeout: 3s
      retries: 30

  garage-init:
    <<: *app
    profiles: [storage]
    entrypoint: [bun, --no-env-file, apps/server/tools/garage-init.ts]
    command: []
    environment:
      <<: *app-env
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:-}
      GARAGE_CAPACITY_BYTES: ${GARAGE_CAPACITY_BYTES:-10000000000}
      S3_CORS_ORIGINS: ${S3_CORS_ORIGINS:-}
    depends_on:
      garage:
        condition: service_healthy

  clamav:
    image: clamav/clamav:1.5.4-debian
    profiles: [scan]
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 100M
      CLAMD_CONF_MaxFileSize: 100M
      CLAMD_CONF_AlertExceedsMax: 'yes'
    volumes:
      - clamav-db:/var/lib/clamav
    networks: [backend, edge]
    healthcheck:
      test: [CMD, clamdcheck.sh]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 300s

  backup:
    build:
      context: .
      dockerfile: Backup.Dockerfile
    profiles: [backup]
    environment:
      PGHOST: postgres
      PGUSER: backbricks
      PGDATABASE: backbricks
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:-/repository}
      BACKUP_NAMESPACE: ${BACKUP_NAMESPACE:-}
      RESTIC_PASSWORD_FILE: /run/secrets/restic-password
    volumes:
      - ./restic-password:/run/secrets/restic-password:ro
      - ${BACKUP_REPOSITORY_DIR:-./backup-repository}:/repository
      - garage-meta:/garage/meta
      - garage-data:/garage/data
    networks: [backend, edge]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  backend:
    internal: true
  edge:
    ipam:
      config:
        - subnet: ${CADDY_SUBNET:-172.31.241.0/28}
          ip_range: ${CADDY_DYNAMIC_RANGE:-172.31.241.8/29}

volumes:
  postgres:
  garage-meta:
  garage-data:
  clamav-db:
  caddy-data:
  caddy-config:
